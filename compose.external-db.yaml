# Override for a Postgres this Compose project does not own. Load it once, in
# `.env`, rather than `-f` on every `ps`, `logs` and `down`:
#
#     COMPOSE_FILE=compose.yaml:compose.external-db.yaml
#
# Gives up requirement 1, `app`'s no-egress guarantee: `external-db` is a plain
# bridge, so `app` regains a default route, external DNS (research §1.4) and a
# route to every host service bound on `0.0.0.0`. Requirements 3 and 5 hold.
#
# `db` and `dump` sit behind a profile nothing here names — `dump-loop.sh`
# refuses any host but `db`. `COMPOSE_PROFILES=bundled-db` brings them back.
# POSTGRES_PASSWORD stays required regardless: interpolation runs before profile
# filtering, and nothing has to match the Postgres this points at.

name: portfolio

networks:
  external-db:
    enable_ipv6: false

services:
  app:
    networks:
      - external-db
    depends_on:
      db:
        condition: service_healthy
        # Only here, and required: `db` is profiled out below, so without this
        # the override cannot render at all. It also makes the dependency
        # advisory, so under `COMPOSE_PROFILES=bundled-db` an unhealthy bundled
        # database no longer holds `app` back.
        required: false

  db:
    profiles: ["bundled-db"]

  dump:
    profiles: ["bundled-db"]
