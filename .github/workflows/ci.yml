name: CI

on:
  push:
    branches: [main]
    # `[0-9]`, not a bare `*`: a non-version tag could only fail as bad semver.
    tags: ['v[0-9]*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The runtime strips types without checking them — DESIGN.md §9.
      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Real Postgres: the risk is Postgres-specific `numeric` handling.
      - name: Start the test database
        run: docker compose -f compose.test.yaml up -d --wait

      # The db:types check below needs a migrated database; the suite migrates itself.
      - name: Apply migrations
        run: npm run migrate
        env:
          DATABASE_URL: postgres://portfolio:portfolio@127.0.0.1:55432/portfolio_test
          # migrate.ts calls loadConfig, which validates the whole schema.
          PUBLIC_ORIGIN: https://portfolio.example.com

      - name: Test
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://portfolio:portfolio@127.0.0.1:55432/portfolio_test

      # A migration landing without a regeneration silently leaves every query
      # typed against the old schema.
      - name: Verify the committed database types match the schema
        run: npm run db:types -- --verify
        env:
          DATABASE_URL: postgres://portfolio:portfolio@127.0.0.1:55432/portfolio_test

      - name: Stop the test database
        if: always()
        run: docker compose -f compose.test.yaml down -v

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # An audit job is the last place to execute the code it is checking.
      - run: npm ci --ignore-scripts

      # The only check that notices a pinned name+version republished with
      # different contents. Everything in the lockfile is signed today.
      - name: Verify registry signatures
        run: npm audit signatures

      # Production only: don't redden the branch over a moderate in a build tool.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # The Dockerfile's cross-platform, cross-libc invariant. A native
      # dependency breaks the published image at runtime, silently — so fail here.
      - name: Enforce the pure-JavaScript production tree
        run: |
          node -e '
            const lock = require("./package-lock.json");
            const offenders = Object.entries(lock.packages)
              .filter(([path, pkg]) => path && !pkg.dev)
              .filter(([, pkg]) => pkg.hasInstallScript || pkg.os || pkg.cpu)
              .map(([path, pkg]) =>
                `${path}: ${["hasInstallScript", "os", "cpu"].filter((f) => pkg[f]).join(", ")}`);
            if (offenders.length > 0) {
              console.error("Production packages with native or platform-specific markers:");
              console.error(offenders.join("\n"));
              console.error("The Dockerfile header names the invariant this breaks.");
              process.exit(1);
            }
            console.log("no production package declares hasInstallScript, os or cpu");
          '

      # Below is reported, not enforced: the fix is usually somebody else's release.
      - name: Report dev advisories
        if: always()
        run: npm audit || true

      # The lockfile records deprecations as of the resolution that wrote it, so
      # re-resolve first to catch anything deprecated since it was committed.
      - name: Report deprecated packages
        if: always()
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e '
            const lock = require("./package-lock.json");
            const gone = Object.entries(lock.packages)
              .filter(([, p]) => p.deprecated)
              .map(([k, p]) => `${k.split("node_modules/").pop()}@${p.version}: ${p.deprecated}`);
            console.log(gone.length ? gone.join("\n") : "no deprecated packages in the tree");
          '

  smoke:
    name: Container smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Smoke test
        run: ./scripts/smoke-test.sh

  # Here rather than a release workflow, so a tag is gated on everything CI checks.
  publish:
    name: Publish the container image
    needs: [check, audit, smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # All GHCR needs — no PAT to create, store or rotate.
      packages: write
    steps:
      - uses: actions/checkout@v5

      # No setup-qemu-action: `deps`/`build` run on the runner's own
      # architecture (Dockerfile header), so the arm64 leg is a copy.
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v1.2.3 → 1.2.3, 1.2, 1. The `v` is stripped, which is why compose.yaml
      # pins `1`. `latest` is left unlisted on purpose: `type=raw` would let a
      # v1.0.0-rc1 become what every unpinned instance upgrades to.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/portfolio-app
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - uses: docker/build-push-action@v7
        with:
          # The checkout, not the default git context, which ignores .dockerignore.
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The package page reads a manifest list's index annotations, not labels.
          annotations: ${{ steps.meta.outputs.annotations }}
          # Default provenance adds entries GHCR renders as `unknown/unknown`.
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
