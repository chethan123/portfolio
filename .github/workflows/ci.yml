name: CI

on:
  push:
    branches: [main]
    # Version tags publish the container image (`publish` job). `[0-9]`, not a
    # bare `*`: a non-version tag could only end in "not a valid semver".
    tags: ['v[0-9]*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The runtime strips types without checking them (DESIGN.md §9); this is
      # the only place stripped types are verified.
      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Real Postgres, not a mock: the guarded risk lives in Postgres-specific
      # `numeric` handling, which disappears under a substitute.
      - name: Start the test database
        run: docker compose -f compose.test.yaml up -d --wait

      # Explicit because the type verification below needs a migrated database
      # to compare against (the suite applies migrations itself).
      - name: Apply migrations
        run: npm run migrate
        env:
          DATABASE_URL: postgres://portfolio:portfolio@127.0.0.1:55432/portfolio_test

      - name: Test
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://portfolio:portfolio@127.0.0.1:55432/portfolio_test

      # Committed types derive from the live database: a migration landing
      # without a regeneration would silently leave every query typed against
      # the old schema.
      - name: Verify the committed database types match the schema
        run: npm run db:types -- --verify
        env:
          DATABASE_URL: postgres://portfolio:portfolio@127.0.0.1:55432/portfolio_test

      - name: Stop the test database
        if: always()
        run: docker compose -f compose.test.yaml down -v

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # `--ignore-scripts`: nothing here needs install hooks, and an audit job
      # is the last place to execute the third-party code it is checking.
      - run: npm ci --ignore-scripts

      # The only check that notices a pinned name+version republished with
      # different contents. Everything in the lockfile is registry-signed
      # today, so a gap here is a finding, not noise.
      - name: Verify registry signatures
        run: npm audit signatures

      # Production, high and critical only: stop a serious advisory in code
      # the container runs, not redden the branch over a moderate in a build tool.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Reported, not enforced: the fix for a transitive advisory or a
      # deprecation is usually somebody else's release.
      - name: Report dev advisories
        if: always()
        run: npm audit || true

      # The lockfile records deprecations only as of the resolution that wrote
      # it, so re-resolve into the throwaway workspace first — that surfaces a
      # package deprecated *since* the lockfile was committed.
      - name: Report deprecated packages
        if: always()
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e '
            const lock = require("./package-lock.json");
            const gone = Object.entries(lock.packages)
              .filter(([, p]) => p.deprecated)
              .map(([k, p]) => `${k.split("node_modules/").pop()}@${p.version}: ${p.deprecated}`);
            console.log(gone.length ? gone.join("\n") : "no deprecated packages in the tree");
          '

  smoke:
    name: Container smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Smoke test
        run: ./scripts/smoke-test.sh

  # Lives here rather than in a release workflow so a tag is gated on
  # *everything* this file checks — a separate workflow could only re-run the
  # jobs or trust they passed on main. One place to read what CI does.
  publish:
    name: Publish the container image
    # All three: `check` (types + tests), `audit` (production advisories),
    # `smoke` (the container itself) — what makes "a published image passed
    # CI" a fact rather than a convention.
    needs: [check, audit, smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The only elevated permission, and all GHCR needs: GITHUB_TOKEN pushes
      # to a package this repository owns — no PAT to create, store or rotate.
      packages: write
    steps:
      - uses: actions/checkout@v5

      # No setup-qemu-action: the Dockerfile builds `deps`/`build` on the
      # runner's own architecture (see its header), so the arm64 leg is a copy.
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image tags derive from the git tag: v1.2.3 → 1.2.3, 1.2, 1, `latest`.
      # The `v` is stripped — why compose.yaml pins `1`, not `v1`. `latest` is
      # deliberately unlisted: the default `latest=auto` withholds it from a
      # pre-release, where `type=raw` would let a v1.0.0-rc1 become what every
      # unpinned instance upgrades to.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/portfolio-app
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - uses: docker/build-push-action@v7
        with:
          # The checkout, not the default git context — which ignores
          # .dockerignore and anything a previous step wrote.
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # A multi-platform image is a manifest list; the package page reads
          # its description from index annotations, not image labels.
          annotations: ${{ steps.meta.outputs.annotations }}
          # Default provenance (mode=max on public repos) adds manifest
          # entries GHCR renders as `unknown/unknown` architectures.
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
