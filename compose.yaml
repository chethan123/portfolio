# The whole deployment — DESIGN.md §10.1.
# Not turnkey: Google OAuth credentials in `.env` and `mkdir -p ./volumes/db/data
# ./volumes/dumps` first. `${VAR:?}` fails `up` rather than start half-protected.

name: portfolio

# pg_dump refuses a server newer than itself — `db` and `dump` share one tag.
x-postgres-image: &postgres-image postgres:17-alpine

# Healthchecks alone log ~17k lines/day, ~0.5 GB/year uncapped. Issue #192.
x-logging: &container-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: *postgres-image
    restart: unless-stopped
    logging: *container-logging
    # The image's postgres account, pinned so no root process ever exists —
    # skips the entrypoint's root-then-gosu drop.
    user: "70:70"
    environment:
      # Not in DATABASE_URL: change here, then `alter role` on the running server.
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?missing POSTGRES_PASSWORD — see docs/operating.md, Upgrading}"
      POSTGRES_DB: portfolio
      TZ: UTC
      PGTZ: UTC
    command:
      - postgres
      - -c
      - timezone=UTC
      - -c
      - log_timezone=UTC
    volumes:
      - db-store:/var/lib/postgresql/data
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      # Socket + lock file. A tmpfs inherits its mount point's mode; this dir is
      # 3777 in-image so uid 70 can write, `/run` (0755 root) would not. The
      # entrypoint's chmod here logs `Operation not permitted` — cosmetic.
      - /var/run/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Nightly dump — docs/specs/0014-scheduled-dump.md, ADR-0009.
  dump:
    image: *postgres-image
    # Not `unless-stopped`: DUMP_ENABLED=false exits 0 and must stay exited.
    restart: on-failure
    logging: *container-logging
    depends_on:
      db:
        condition: service_healthy
    # The operator's own account — the dumps must stay readable to whatever
    # collects them. Required, not defaulted: 1000 would collide with `app`'s
    # uid, and shared uids share bind-mount rights.
    user: "${DUMP_UID:?set DUMP_UID to the account owning ./volumes/dumps — `id -u`}:${DUMP_GID:?set DUMP_GID to that account's group — `id -g`}"
    environment:
      # Password via PGPASSWORD, not the URL — libpq reads it when the URL has none.
      DATABASE_URL: ${DATABASE_URL:-postgres://portfolio@db:5432/portfolio}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      # Recorded beside each dump: which image wrote it.
      APP_VERSION: ${APP_VERSION:-1}
      # `-` not `:-`: an empty value passes through so the script refuses it by
      # name; the colon form would read `DUMP_ENABLED=` as true.
      DUMP_ENABLED: ${DUMP_ENABLED-true}
      DUMP_AT: ${DUMP_AT-02}
      DUMP_KEEP_DAYS: ${DUMP_KEEP_DAYS-7}
      DUMP_COMPRESS: ${DUMP_COMPRESS-0}
      # Pinned, not ${TZ:-UTC}: DUMP_AT is a UTC hour.
      TZ: UTC
    # Entrypoint, not command, so `compose run dump verify <file>` can replace it.
    entrypoint: ["sh", "/usr/local/bin/dump-loop.sh"]
    command: ["loop"]
    volumes:
      # create_host_path: false — a missing path stops `up` naming it, rather
      # than creating a root-owned directory this service cannot write.
      - type: bind
        source: ./scripts/dump-loop.sh
        target: /usr/local/bin/dump-loop.sh
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./volumes/dumps
        target: /dumps
        bind:
          create_host_path: false
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      # pg_dump stderr only; the archive goes straight to /dumps, never staged
      # here — a cross-device `mv` is a copy a collector could catch half-landed.
      - /tmp
    healthcheck:
      # Age of the newest dump, not the last exit status. Nothing acts on it.
      test: ["CMD", "sh", "/usr/local/bin/dump-loop.sh", "healthcheck"]
      interval: 5m
      timeout: 10s
      retries: 3
      # First dump on a large database takes minutes.
      start_period: 15m
  app:
    # No `build:` on purpose: a deploy that cannot reach the registry must fail
    # loudly, not build for minutes on some NAS. compose.dev.yaml builds.
    image: ghcr.io/chethan123/portfolio-app:${APP_VERSION:-1}
    # What makes `up -d` an upgrade: `missing` fetches a floating tag once only.
    pull_policy: always
    restart: unless-stopped
    logging: *container-logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://portfolio@db:5432/portfolio}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      # Also `gate`'s redirect base below, and the lock's relying-party id (ADR-0012).
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:?missing PUBLIC_ORIGIN — see .env.example, the entry beside DATABASE_URL, not the gate section}"
      # `gate` fronts the app: suppresses the unprotected-instance banner, and
      # authenticates nobody (server/config.ts).
      AUTH_GATE: external
      PORT: ${PORT:-3000}
      MARKET_TIMEZONE: ${MARKET_TIMEZONE:-America/New_York}
      TZ: ${TZ:-UTC}
    volumes:
      # `:ro` — this volume is `worker`'s one writable path, not `app`'s.
      - price-worker-sock:/run/price-worker:ro
    # Neither carries a default route, so `app` has no route off them at IP
    # level. Residual, known not closed: `app` still reaches `gate` through
    # Caddy's `/oauth2/*` (spec 0018 §2.1).
    networks:
      - backend
      - caddy-app
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # yahoo-finance2 behind a unix socket — spec 0018. The only container that
  # fetches a price; reaches Yahoo only through `egress-proxy`, with no resolver
  # and no default route of its own.
  worker:
    image: ghcr.io/chethan123/portfolio-app:${APP_VERSION:-1}
    pull_policy: always
    entrypoint: ["node", "./server/price-worker.ts"]
    restart: unless-stopped
    logging: *container-logging
    environment:
      # Read by undici, never by server/config.ts, and only when
      # NODE_USE_ENV_PROXY is exactly `1` (spec 0018 §3.7).
      NODE_USE_ENV_PROXY: "1"
      HTTPS_PROXY: http://egress-proxy:8888
    volumes:
      - price-worker-sock:/run/price-worker
    networks:
      - worker-proxy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    # This is the container the design expects to be compromised: unbounded, a
    # fork bomb or memory balloon reaches the OOM killer, whose victim is Postgres.
    pids_limit: 64
    mem_limit: 256m
    tmpfs:
      - /tmp:size=64m
    healthcheck:
      # Over the socket as the container's own uid — the right party to prove the
      # socket's permissions. Unhealthy = not accepting requests, never "Yahoo down".
      test:
        - CMD
        - node
        - -e
        - "const r=require('http').request({socketPath:'/run/price-worker/worker.sock',path:'/healthz',agent:false,timeout:5000},res=>process.exit(res.statusCode===200?0:1));r.on('error',()=>process.exit(1));r.on('timeout',()=>{r.destroy();process.exit(1)});r.end()"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # `worker`'s only way out — spec 0018 §3.7. CONNECT-only proxy admitting five
  # Yahoo hosts, and only once the TLS ClientHello inside the tunnel names the
  # host it was opened to (server/egress-proxy.ts). Shares a name with the
  # network below, deliberately.
  egress-proxy:
    image: ghcr.io/chethan123/portfolio-app:${APP_VERSION:-1}
    pull_policy: always
    entrypoint: ["node", "./server/egress-proxy.ts"]
    restart: unless-stopped
    logging: *container-logging
    networks:
      - worker-proxy
      - egress-proxy
    # Reachable from a compromised `worker`: no more trust than the thing it fences.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    pids_limit: 64
    mem_limit: 256m
    tmpfs:
      - /tmp:size=64m
    healthcheck:
      # A request, not a bare connect: with all eight `maxConnections` held by
      # stalled tunnels the accept queue still completes a TCP handshake.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8888/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  gate:
    # Pinned exactly: nobody watches this image and it guards everything.
    # `-alpine` because the distroless default has no wget for the healthcheck.
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4-alpine
    restart: unless-stopped
    logging: *container-logging
    environment:
      OAUTH2_PROXY_PROVIDER: google
      # `:?` is evaluated before any container starts.
      OAUTH2_PROXY_CLIENT_ID: "${GATE_CLIENT_ID:?missing GATE_CLIENT_ID — see the gate section of .env.example}"
      OAUTH2_PROXY_CLIENT_SECRET: "${GATE_CLIENT_SECRET:?missing GATE_CLIENT_SECRET — see the gate section of .env.example}"
      OAUTH2_PROXY_COOKIE_SECRET: "${GATE_COOKIE_SECRET:?missing GATE_COOKIE_SECRET — see the gate section of .env.example}"
      # Character-for-character the redirect URI registered on the OAuth client.
      OAUTH2_PROXY_REDIRECT_URL: "${PUBLIC_ORIGIN:?missing PUBLIC_ORIGIN — see .env.example, the entry beside DATABASE_URL, not the gate section}/oauth2/callback"
      # The default 127.0.0.1:4180 is unreachable from `caddy`.
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      # Trusts X-Forwarded-* from whatever reaches it — what makes the missing
      # `ports:` below load-bearing.
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      # X-Auth-Request-Email, copied on by the Caddyfile. Attribution, never permission.
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      # The entire authorization policy. `email_domains` unset on purpose: the
      # narrowest domain admitting the family admits every Gmail account on earth.
      OAUTH2_PROXY_AUTHENTICATED_EMAILS_FILE: /etc/oauth2-proxy/allowed-emails.txt
      # Lax, not Strict: a Strict cookie is withheld on the bounce back from Google.
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      TZ: ${TZ:-UTC}
    volumes:
      # create_host_path: false — the short form creates a *directory* at a
      # missing source: a crash-looping sidecar plus a junk dir.
      - type: bind
        source: ./allowed-emails.txt
        target: /etc/oauth2-proxy/allowed-emails.txt
        read_only: true
        bind:
          create_host_path: false
    # Neither reaches `app`, `db` or `worker`. `egress-gate` is a plain bridge:
    # unrestricted egress plus a route to the host — worth naming because this is
    # the one container running as root.
    networks:
      - caddy-gate
      - egress-gate
    # Root, unlike `app`: the image sets no USER, and pinning one would decide the
    # allowlist's file mode on the operator's behalf.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Root's power to open a file it does not own IS this capability; without it
    # the sidecar crash-loops on `failed opening authenticated-emails-file`.
    cap_add:
      - DAC_READ_SEARCH
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4180/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *container-logging
    # Own uid, not `app`'s 1000: shared uids share bind-mount rights, and the one
    # LAN-reachable service is the worst to join. 65532 = distroless "nonroot".
    user: "65532:65532"
    depends_on:
      app:
        condition: service_healthy
      gate:
        condition: service_healthy
    environment:
      APP_PORT: ${PORT:-3000}
    # The only published port, so the only place the gate can be enforced. Plain
    # HTTP: TLS and the hostname belong to the house-wide Caddy in front. The
    # container side is the Caddyfile's site address — change one, change both.
    ports:
      - "80:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - caddy-app
      - caddy-gate
      - ingress
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Not for binding — 8080 needs nothing. /usr/bin/caddy carries the file
    # capability cap_net_bind_service=ep, and the kernel refuses to exec a binary
    # whose file caps the bounding set cannot supply.
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      # Both dirs are root 0755 in-image and a tmpfs inherits its mount point's
      # mode, so the pinned uid could not write them. Buys clean logs only.
      - /config:mode=1777
      - /data:mode=1777
    healthcheck:
      # /healthz is the only route answering without a Google session.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  # A bound name rather than a plain bind, for the one thing a bind cannot do —
  # ownership: a volume over an *empty* directory takes the image's 70:70 before
  # initdb looks. Empty is load-bearing; any file in there first (a .gitkeep)
  # skips that and initdb refuses the directory. Not `db-data`: reusing that name
  # over an existing instance's volume makes `up` offer to destroy it.
  db-store:
    driver: local
    driver_opts:
      type: none
      o: bind
      # Resolved against the project directory. Must already exist.
      device: ./volumes/db/data

  # tmpfs, not a bind: the socket must not outlive the host. uid/gid 1000 is the
  # image's `node` user, which `app` and `worker` both run as. The mode is not the
  # fence — `app` mounts this `:ro` — the mount set is, asserted in
  # scripts/smoke-test.sh. `driver_opts` are read once at creation, so changing
  # `o:` needs a new volume *name*, never `down -v` (which takes `db-store` too).
  price-worker-sock:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=1m,uid=1000,gid=1000,mode=0770"

networks:
  # Docker Engine 28.0+ required and load-bearing: 26 ignores `gateway_mode_ipv4`
  # silently, 27 refuses it, and without it every container on an `internal`
  # network still gets an address on the host — a route to whatever else the house
  # binds on `0.0.0.0`. scripts/smoke-test.sh checks the floor.
  #
  # `caddy-app` and `caddy-gate` are kept apart to deny `app` a direct route to
  # `gate:4180`; that is the only claim — `trusted_proxies static private_ranges`
  # (Caddyfile:19) still lets `app` forge X-Forwarded-* *through* Caddy.
  # `worker-proxy` allocates no gateway, so `worker` cannot reach the host's
  # published ports either. The plain bridges carry a default route
  # (`egress-proxy`, `egress-gate`) or the published port (`ingress`).
  backend:
    internal: true
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
  caddy-app:
    internal: true
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
  caddy-gate:
    internal: true
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
  worker-proxy:
    internal: true
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
  egress-proxy:
    enable_ipv6: false
  egress-gate:
    enable_ipv6: false
  ingress:
    enable_ipv6: false
