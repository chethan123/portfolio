# Three services — DESIGN.md §10.1. The price poller runs in-process inside
# `app`, which is why there is no separate worker: a worker container would
# mean two images, two deployments and two places to read logs. `caddy` is a
# different kind of service — the ingress front door — and is the only one
# that publishes a port; `app` and `db` are reachable only on the compose
# network.
#
#   docker compose up -d
#
# on a fresh machine with an empty volume produces a working instance with no
# manual steps. Copy .env.example to .env first only if you want to change
# something; every setting has a working default except the ones with none.

name: portfolio

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      # Reachable only on the Compose network — the port below is deliberately
      # not published, so these credentials are not exposed to your LAN. If you
      # change them, change DATABASE_URL to match.
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portfolio}
      POSTGRES_DB: portfolio
      # Timestamps are stored UTC regardless; this makes the server's own logs
      # and any `now()` default agree with that.
      TZ: UTC
      PGTZ: UTC
    command:
      - postgres
      - -c
      - timezone=UTC
      - -c
      - log_timezone=UTC
    volumes:
      # The one named volume. All persistent state lives here, so there is
      # exactly one backup target (DESIGN.md §10, `pg_dump`).
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    # No `ports:` by design. The app reaches Postgres over the Compose network;
    # publishing it would put the database on the host's network for nothing.

  app:
    # Pulled, never built here. The image is published to GHCR by the `publish`
    # job in .github/workflows/ci.yml when a `v*` tag is pushed. The tag is the
    # floating major, so every v1.x.y release lands on `1`; set APP_VERSION to a
    # full version to hold an instance still or to go back to a known-good image.
    #
    # There is deliberately no `build:` stanza. This is the deployment file, and
    # a deploy that cannot reach the registry — an unreachable network, a typo'd
    # tag — must fail loudly rather than quietly building a multi-minute image on
    # whatever NAS or VPS happens to be running it. Building from source is
    # `compose.dev.yaml`, which says so in one place.
    image: ghcr.io/chethan123/portfolio-app:${APP_VERSION:-1}
    # This is what makes `docker compose up -d` an upgrade rather than a no-op.
    # Under Compose's default `missing` policy a floating tag is fetched once and
    # then never again, so a new release would install itself only on a machine
    # that had never run the old one — silently, with no error to notice.
    pull_policy: always
    restart: unless-stopped
    depends_on:
      db:
        # A cold boot must not fail on a startup race.
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://portfolio:portfolio@db:5432/portfolio}
      SESSION_SECRET: ${SESSION_SECRET:-}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      PORT: ${PORT:-3000}
      PRICE_POLL_INTERVAL_MINUTES: ${PRICE_POLL_INTERVAL_MINUTES:-15}
      MARKET_TIMEZONE: ${MARKET_TIMEZONE:-America/New_York}
      TZ: ${TZ:-UTC}
    # No `ports:` by design, same as `db` above. Only `caddy` is reachable from
    # outside the compose network; the app is reached at `app:${PORT}`.
    # The container writes nothing to its own filesystem, so it can be destroyed
    # and recreated freely. Enforced rather than merely intended.
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      # Caddy substitutes this into the Caddyfile below. Kept in sync with the
      # app's own listen port rather than hardcoded.
      APP_PORT: ${PORT:-3000}
    # The only port published to the host. Plain HTTP on 80 for now — TLS
    # termination is a follow-up.
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  db-data:
