# The whole deployment — DESIGN.md §10.1. The price poller still runs
# in-process in `app`; `worker` is the same image, reached over a socket in a
# shared volume, and holds no credential of its own. The one scheduled
# service is `dump`, argued in ADR-0009 — a dump that stops when the app is
# down is worthless, and `pg_dump` belongs to the database's image. `caddy`
# is the ingress front door and the only service that publishes a port;
# everything else exists only on the compose network.
#
# `docker compose up -d` deliberately does NOT produce a working instance with
# zero manual steps: that promise meant an instance open to anything on a home
# LAN. Google sign-in at `gate` replaces it, and a gate skippable by
# forgetting to configure it is no gate — the `${VAR:?}` interpolations stop
# `up` naming the first missing variable rather than start half-protected.
#
# The two manual steps, each done once: create a Google OAuth client and put
# its credentials in `.env` (copy .env.example; docs/google-sign-in.md walks
# it), and `mkdir -p ./volumes/db/data ./volumes/dumps` — the database (the
# `db-store` volume at the bottom explains why that one has to pre-exist and be
# empty) and the directory the nightly dump lands in, which belongs to the
# operator rather than to a container, and is why `dump` runs as their uid.
# Every other setting, the worker's included, has a working default.
#
# Privilege posture, every service: cap_drop ALL + no-new-privileges +
# read-only rootfs; unprivileged uid pinned everywhere but `gate` (root argued
# there). Both cap_adds were proved by a start failure without them.
# scripts/smoke-test.sh asserts all of it — nothing else would notice a
# container quietly regaining root.
#
# Docker Engine 28.0 is the floor from this release — check with `docker
# version --format '{{.Server.Version}}'`. Declared here, where `worker`
# brings the first non-default network, though not load-bearing until the
# network-lockdown release wires the isolated ones: 26 ignores
# `gateway_mode_ipv4` silently and leaves a host address reachable on the
# bridge; 27 refuses the option outright. scripts/smoke-test.sh checks this
# first, so a runner too old reads as "engine too old", not as a topology bug.

name: portfolio

# One tag for the two services that speak Postgres. `pg_dump` refuses a server
# newer than itself, so bumping `db` alone would leave `dump` failing every
# night with nothing tying it to the tag that moved.
x-postgres-image: &postgres-image postgres:17-alpine

# One request line every ten seconds from the app's healthcheck and another
# from Caddy's — ~17k lines a day, ~0.5 GB/year under json-file with no cap.
# 10m x 3 files bounds every container at ~30 MB. Issue #192.
x-logging: &container-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: *postgres-image
    restart: unless-stopped
    logging: *container-logging
    # The image's postgres account (70:70 in postgres:17-alpine), pinned so no
    # root process ever exists — skips the entrypoint's root-then-gosu drop.
    # Fresh volumes initdb fine (image data dir already postgres-owned), and a
    # volume from an older root run also starts: that entrypoint chowned PGDATA
    # to postgres on every boot.
    user: "70:70"
    environment:
      # Reachable only on the Compose network — no published port, so these
      # credentials never face the LAN. Change them = change DATABASE_URL too.
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portfolio}
      POSTGRES_DB: portfolio
      # Storage is UTC regardless; this makes logs and `now()` defaults agree.
      TZ: UTC
      PGTZ: UTC
    command:
      - postgres
      - -c
      - timezone=UTC
      - -c
      - log_timezone=UTC
    volumes:
      # The cluster — ./volumes/db/data on the host, via the bound name below.
      # Still the single backup target (DESIGN.md §10, `pg_dump`).
      - db-store:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # All state lives in the mount above; pg_dump/pg_restore stream over exec
    # and write nothing in-container.
    read_only: true
    tmpfs:
      # The one scratch path Postgres still needs: unix socket + lock file.
      # A tmpfs inherits its mount point's mode — this dir is 3777 in-image so
      # uid 70 can write; `/run` (0755 root) would not do. The entrypoint's
      # chmod here logs `Operation not permitted` each boot: its own `|| :`,
      # cosmetic.
      - /var/run/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    # No `ports:` by design: the app reaches Postgres over the Compose
    # network; publishing would put the database on the host for nothing.

  # The nightly dump — spec docs/specs/0014-scheduled-dump.md, decided in
  # ADR-0009. It prunes, checks there is room, dumps, proves the archive decodes
  # end to end, and leaves it in ./volumes/dumps for whatever the operator uses
  # to take it off this machine. It never reaches off the host itself, and holds
  # no credential the stack does not already have.
  dump:
    # The database's own image: pg_dump must match the server it dumps, which is
    # a fact about `db` rather than about this service — hence the shared tag.
    image: *postgres-image
    # `on-failure`, not `unless-stopped` like everything else here: a crash or a
    # bad knob must come back, but DUMP_ENABLED=false exits 0 and has to STAY
    # exited, so that turning dumps off reads as `Exited (0)` under
    # `docker compose ps -a` rather than as another healthy-looking row.
    restart: on-failure
    logging: *container-logging
    depends_on:
      db:
        # A cold boot must not race initdb. This is also what ties the service
        # to the bundled database: an operator running against their own
        # Postgres deletes `db`, and deletes this service with it.
        condition: service_healthy
    # The operator's own account, because the directory is theirs: whatever uid
    # a container runs as, Docker creates a missing bind source root-owned, so
    # no choice here rescues an absent directory — `mkdir -p` does, and then the
    # files have to be readable to whatever collects them. Required rather than
    # defaulted: 1000 would silently collide with `app`'s uid, and shared uids
    # share bind-mount rights (see `caddy` below).
    user: "${DUMP_UID:?set DUMP_UID to the account owning ./volumes/dumps — `id -u`}:${DUMP_GID:?set DUMP_GID to that account's group — `id -g`}"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://portfolio:portfolio@db:5432/portfolio}
      # Recorded beside each dump, so the archive says which image wrote it —
      # the half of a rollback that a dump alone cannot tell you.
      APP_VERSION: ${APP_VERSION:-1}
      # `-` rather than `:-`: an *unset* knob takes the default, an explicitly
      # empty one is passed through so the script can refuse it by name. With
      # the colon form `DUMP_ENABLED=` would silently mean `true`.
      DUMP_ENABLED: ${DUMP_ENABLED-true}
      DUMP_AT: ${DUMP_AT-02}
      DUMP_KEEP_DAYS: ${DUMP_KEEP_DAYS-7}
      DUMP_COMPRESS: ${DUMP_COMPRESS-0}
      # Pinned, not `${TZ:-UTC}` like the others: DUMP_AT is documented as a UTC
      # hour, and inheriting the operator's zone would quietly move the window.
      TZ: UTC
    # An entrypoint rather than a command, because `docker compose run dump
    # verify <file>` REPLACES the command — with the script as the command the
    # image would try to execute `verify` itself. `sh` in front so a lost
    # executable bit cannot break the deployment.
    entrypoint: ["sh", "/usr/local/bin/dump-loop.sh"]
    command: ["loop"]
    volumes:
      # Long syntax for `create_host_path: false` on both, same as the gate's
      # allowlist: a missing script or a missing dumps directory stops `up` with
      # a message naming the path, rather than creating a root-owned directory
      # this service then cannot write.
      - type: bind
        source: ./scripts/dump-loop.sh
        target: /usr/local/bin/dump-loop.sh
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./volumes/dumps
        target: /dumps
        bind:
          create_host_path: false
    # No ports, no egress, and nothing written outside the bind above.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      # pg_dump's stderr is captured here; the archive itself is written
      # straight into /dumps, never staged on a tmpfs — a cross-device `mv` is
      # a copy, and a collector would see the half of it that had landed.
      - /tmp
    healthcheck:
      # The age of the newest dump, not the last exit status: a run that
      # succeeded three weeks ago exited 0 too. Nothing acts on the result —
      # restart policies react to a process exiting, not to health — so this is
      # for a human reading `docker compose ps`, and the marker files in
      # ./volumes/dumps are what reach the operator's own monitoring.
      test: ["CMD", "sh", "/usr/local/bin/dump-loop.sh", "healthcheck"]
      interval: 5m
      timeout: 10s
      retries: 3
      # A first dump on a large database takes minutes, and the directory is
      # empty until it lands.
      start_period: 15m
  app:
    # Pulled, never built here. Published to GHCR by ci.yml's `publish` job on
    # a `v*` tag; the floating major puts every v1.x.y on `1` — set APP_VERSION
    # to a full version to pin or roll back. Deliberately no `build:` stanza: a
    # deploy that cannot reach the registry must fail loudly, not quietly build
    # a multi-minute image on some NAS. Building is `compose.dev.yaml`'s job.
    image: ghcr.io/chethan123/portfolio-app:${APP_VERSION:-1}
    # What makes `up -d` an upgrade: under the default `missing` policy a
    # floating tag is fetched once and never again — a new release would land
    # only on machines that never ran the old one, silently.
    pull_policy: always
    restart: unless-stopped
    logging: *container-logging
    depends_on:
      db:
        # A cold boot must not fail on a startup race.
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://portfolio:portfolio@db:5432/portfolio}
      # One variable, two services — deliberately, not by accident. `gate`
      # builds its Google redirect from this same value below; the app
      # derives the lock's relying-party id from it (docs/adr/0012). Fail-
      # closed like `gate`'s own required settings: a missing value names
      # itself before any container starts, rather than the app crash-looping
      # behind a Caddy that is already refusing everything.
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:?missing PUBLIC_ORIGIN — see .env.example, the entry beside DATABASE_URL, not the gate section}"
      # A fact in this file, not a switch: `gate` fronts the app, so the app
      # must not draw its unprotected-instance banner. It still authenticates
      # nobody — `server/config.ts` has the argument.
      AUTH_GATE: external
      PORT: ${PORT:-3000}
      MARKET_TIMEZONE: ${MARKET_TIMEZONE:-America/New_York}
      TZ: ${TZ:-UTC}
    # No `ports:`, same as `db` — only `caddy` faces outside; the app is
    # reached at `app:${PORT}`. Writes nothing to its own filesystem;
    # `read_only` enforces that rather than merely intending it.
    volumes:
      # The worker's socket lives here. This ticket only mounts it — nothing
      # calls it yet, `app` still fetches prices in-process — so the cutover
      # in ticket 06 changes no compose line, only code. `:ro`: the volume is
      # `worker`'s one writable path, not `app`'s (research §8.3).
      - price-worker-sock:/run/price-worker:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # The internet-facing half of spec 0018: `yahoo-finance2` behind a unix
  # socket, same image as `app` with its `CMD` replaced by the worker
  # entrypoint. Nothing calls the socket yet — `app` above still fetches
  # in-process — so it listens, idles, and reports healthy until ticket 06's
  # cutover.
  worker:
    image: ghcr.io/chethan123/portfolio-app:${APP_VERSION:-1}
    pull_policy: always
    # Also drops the image `CMD`: neither the migration step nor
    # `react-router-serve` runs here, only the worker.
    entrypoint: ["node", "./server/price-worker.ts"]
    restart: unless-stopped
    logging: *container-logging
    # No `depends_on`: no database, no other service — startup needs nothing
    # to exist but the volume below, and Compose creates that itself.
    #
    # No `environment:` at all: no `DATABASE_URL`, no `PGPASSWORD`, no
    # `MARKET_TIMEZONE`, and no `TZ` — the worker reads no clock, and the
    # image already sets `TZ=UTC` (Dockerfile:94-96). `PRICE_WORKER_SOCKET`
    # is a development-only knob (spec 0018 §3.3); this file wires it into
    # neither service, so both `worker` and `app` run the fixed default path
    # the healthcheck below also uses.
    volumes:
      - price-worker-sock:/run/price-worker
    networks:
      - egress-worker
    # Hardening copied from `app` above: no-new-privileges, cap_drop: ALL,
    # read_only; the image's `node` user (uid 1000, no `user:` line needed);
    # no `ports:` — the worker has no TCP listener to publish. Plus the
    # bounds `app` does not carry: this is the container the design expects
    # to be compromised, and nothing today stops a fork bomb, a memory
    # balloon, or a `dd` into an unsized `/tmp` from driving the host into
    # the OOM killer, whose usual victim is Postgres.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    pids_limit: 64
    mem_limit: 256m
    tmpfs:
      - /tmp:size=64m
    healthcheck:
      # GET /healthz over the socket, run as the container's own uid — the
      # right party to prove the socket's permissions (research §8.10).
      # Nothing restarts an unhealthy container; this is for a human reading
      # `docker compose ps`. "unhealthy" here means the worker is not
      # accepting requests on its socket — never "Yahoo is failing": a Yahoo
      # outage still answers `/healthz` fine.
      test:
        - CMD
        - node
        - -e
        - "const r=require('http').request({socketPath:'/run/price-worker/worker.sock',path:'/healthz',agent:false,timeout:5000},res=>process.exit(res.statusCode===200?0:1));r.on('error',()=>process.exit(1));r.on('timeout',()=>{r.destroy();process.exit(1)});r.end()"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  gate:
    # oauth2-proxy: the forward-auth sidecar `caddy` asks before any request
    # reaches `app` (Caddyfile). Pinned to an exact release — unlike `app`,
    # nobody watches this image for breaking changes, and it guards everything.
    # `-alpine` because the default distroless image has no wget for the
    # healthcheck (a healthcheck runs inside the container it checks).
    # Stateless — the session is an encrypted browser cookie — hence no volume.
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4-alpine
    restart: unless-stopped
    logging: *container-logging
    environment:
      OAUTH2_PROXY_PROVIDER: google
      # Fail-closed: `:?` is evaluated before any container starts, so a
      # missing credential is a message naming the variable, not a sidecar
      # crash-looping behind a Caddy already refusing everything on :80.
      OAUTH2_PROXY_CLIENT_ID: "${GATE_CLIENT_ID:?missing GATE_CLIENT_ID — see the gate section of .env.example}"
      OAUTH2_PROXY_CLIENT_SECRET: "${GATE_CLIENT_SECRET:?missing GATE_CLIENT_SECRET — see the gate section of .env.example}"
      OAUTH2_PROXY_COOKIE_SECRET: "${GATE_COOKIE_SECRET:?missing GATE_COOKIE_SECRET — see the gate section of .env.example}"
      # Google redirects the *browser* here: the origin the house proxy serves,
      # never a compose-network address — and character-for-character the
      # redirect URI registered on the OAuth client, or Google refuses.
      OAUTH2_PROXY_REDIRECT_URL: "${PUBLIC_ORIGIN:?missing PUBLIC_ORIGIN — see .env.example, the entry beside DATABASE_URL, not the gate section}/oauth2/callback"
      # The default 127.0.0.1:4180 is unreachable from `caddy` inside a container.
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      # Believe Caddy's X-Forwarded-* headers — without it the sidecar builds
      # sign-in redirects from the container-internal host. Also what makes the
      # missing `ports:` below load-bearing: the sidecar trusts these headers
      # from whatever reaches it, so "only Caddy can" has to hold.
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      # X-Auth-Request-Email on the /oauth2/auth response; the Caddyfile copies
      # it onto the forwarded request. The app ignores it today: attribution
      # for later, never permission.
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      # Skip the sidecar's own sign-in page — the only sign-in screen is Google's.
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      # The entire authorization policy, one address per line. `email_domains`
      # deliberately unset: the narrowest domain admitting the family admits
      # every other Gmail account on earth.
      OAUTH2_PROXY_AUTHENTICATED_EMAILS_FILE: /etc/oauth2-proxy/allowed-emails.txt
      # Spelled out, not inherited — the image leaves SameSite unset. SameSite=Lax
      # is the instance's entire CSRF posture, and it still is: the app's own
      # lock (ADR-0012, app/lib/lock.server.ts) issues a cookie of its own now,
      # but that one is SameSite=Lax too, for the identical reason — a `Strict`
      # grant cookie would be withheld on the gate's own cross-site sign-in
      # bounce and re-lock every browser on its schedule. Secure restates a
      # deployment claim: the browser only meets this instance over the house
      # proxy's TLS. Expiry keeps the seven-day default, which makes sign-in
      # once per device.
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      TZ: ${TZ:-UTC}
    volumes:
      # Long syntax purely for `create_host_path: false`: the short form
      # creates a *directory* at a missing source path — a crash-looping
      # sidecar plus a junk dir. This way a missing allowlist stops `up` with
      # a message, like every other missing input.
      - type: bind
        source: ./allowed-emails.txt
        target: /etc/oauth2-proxy/allowed-emails.txt
        read_only: true
        bind:
          create_host_path: false
    # No `ports:` — here enforcement, not tidiness (see REVERSE_PROXY above).
    # Read-only like `app`: no state on disk, failing loudly if that changes.
    # It DOES run as root, unlike `app`: the published image sets no USER, and
    # pinning one would silently decide the allowlist's file mode on the
    # operator's behalf — discovered as a sidecar that won't start. Root in a
    # read-only container with no port and no volume is the smaller risk.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Root's power to open a file it does not own IS this capability. Without
    # it cap_drop ALL breaks the promise above (allowlist of any mode/owner):
    # measured as the sidecar crash-looping on `failed opening
    # authenticated-emails-file: permission denied`. Nothing else here needs a
    # capability — a Go binary on a high port.
    cap_add:
      - DAC_READ_SEARCH
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      # `/ping`: the sidecar's own liveness endpoint, not routed through Caddy
      # — reachable only from inside this container.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4180/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *container-logging
    # Own uid, not the app's 1000: shared uids share bind-mount rights, and the
    # one LAN-reachable service is the worst to join. 65532 = the distroless
    # "nonroot" convention; nothing in this image owns it.
    user: "65532:65532"
    depends_on:
      app:
        condition: service_healthy
      # Caddy refuses whatever the gate hasn't vouched for, so opening the
      # front door early means down-not-open — still worth avoiding.
      gate:
        condition: service_healthy
    environment:
      # Substituted into the Caddyfile; kept in sync with the app's listen port.
      APP_PORT: ${PORT:-3000}
    # The only published port — the single place the gate can be enforced.
    # Plain HTTP: TLS and the public hostname belong to the operator's
    # house-wide Caddy in front.
    #
    # Host side stays 80 (the daemon binds it, not this uid); container side
    # is 8080, the Caddyfile's site address. Change one, change both.
    ports:
      - "80:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Not for binding — 8080 needs nothing. The image ships /usr/bin/caddy
    # with file capability cap_net_bind_service=ep, and the kernel refuses to
    # exec a binary whose effective file caps the bounding set cannot supply:
    # with ALL dropped the container dies at `exec … operation not permitted`
    # before reading any config. Granted back, it goes unused on a high port.
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      # XDG_CONFIG_HOME / XDG_DATA_HOME: autosave.json and the cert cache land
      # here. mode is load-bearing — a tmpfs inherits its mount point's mode,
      # and both dirs are root 0755 in-image, unwritable to the pinned uid.
      # Functionally optional (read-only caddy still serves); they buy clean logs.
      - /config:mode=1777
      - /data:mode=1777
    healthcheck:
      # One request proves config adapted, port bound, and the proxy path to
      # `app` — /healthz is the only route answering without a Google session.
      # busybox wget, same trick as `gate`; a 5xx exits non-zero.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  # The cluster lives at ./volumes/db/data, beside the checkout, rather than in
  # an opaque directory under /var/lib/docker: one path to snapshot, move
  # between machines, or point a backup at.
  #
  # A bound *name* rather than a plain bind mount, for the one thing a bind
  # cannot do — ownership. `db` runs as 70:70 and Docker creates a missing bind
  # source root-owned 0755, which stops initdb dead ("could not change
  # permissions of directory ... Operation not permitted"). A volume mounted
  # over an *empty* directory takes the image's ownership and mode for it
  # (70:70, 1777) before Postgres looks, so `mkdir -p ./volumes/db/data` is the
  # whole setup and wants no root. Empty is load-bearing: any file in there
  # first — a .gitkeep, a half-copied backup — skips that step and initdb
  # refuses the directory.
  #
  # Not called db-data any more: reusing that name over an existing instance's
  # volume makes `up` stop and offer to recreate it (destroying it). The old
  # volume is left alone instead; docs/operating.md has the one-time copy.
  db-store:
    driver: local
    driver_opts:
      type: none
      o: bind
      # Relative to this file — Compose resolves it against the project
      # directory, and has since 1.27.4. The directory must exist: a missing one
      # fails the mount naming the path, rather than quietly starting an
      # instance whose data goes somewhere else.
      device: ./volumes/db/data

  # A tmpfs, not `local`'s bind form like `db-store` above: the socket file is
  # the only content this ever holds, and it must not outlive the host — a
  # data volume here would be a lie about what's worth keeping.
  #
  # `uid=1000,gid=1000` because `app` and `worker` both run as the image's
  # `node` user (research §8.4), so the socket the worker creates at `0660`
  # inside this `0770` directory is connectable by uid 1000 or gid 1000 — and
  # by root regardless, through `CAP_DAC_OVERRIDE` (research §8.5). The mode
  # is not the fence: `app` owns the directory and can `chmod` it. The fence
  # is that only `app` and `worker` mount this volume at all, which
  # scripts/smoke-test.sh asserts.
  #
  # `size=1m`: a socket needs no blocks, and a *data*-full tmpfs would not
  # stop `bind()` anyway — the failure modes that do are spent inodes
  # (`nr_inodes` defaults from RAM, not from `size`) or a directory squatting
  # the path (research §8.8). Either is a refresh outage recovered by
  # recreating the volume, never a data loss.
  #
  # `driver_opts` are read once, at creation, and a name-matched volume is
  # reused untouched (research §8.2) — so, exactly as for `db-store` above, a
  # release that changes the `o:` string below changes this volume's *name*,
  # never `docker compose down -v`, which would take `db-store`'s record with
  # it too.
  price-worker-sock:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=1m,uid=1000,gid=1000,mode=0770"

networks:
  # `enable_ipv6: false` written, not left to the daemon's default. `worker`
  # is the only service on it — no other service gets a `networks:` key in
  # this release, so `db`, `dump`, `app`, `gate` and `caddy` all stay exactly
  # where they are, on the implicit `default` bridge, until the
  # network-lockdown release moves everyone off it. `worker` therefore shares
  # no network with `app`, `gate` or `db`: unreachable from it by name and by
  # IP, the volume above being its only link to the rest of the stack.
  egress-worker:
    enable_ipv6: false
