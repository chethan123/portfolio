# Development override: build the `app` image from this checkout.
#
#     docker compose -f compose.yaml -f compose.dev.yaml up -d --build
#
# compose.yaml has no `build:` stanza on purpose — an operator's `up -d` must
# never silently turn into a build — so this is the only place one is
# configured. `scripts/smoke-test.sh` sets COMPOSE_FILE to both files so CI
# exercises the tree it was handed; use it locally when the change is to the
# Dockerfile, the entrypoint, or compose.yaml — what vitest cannot see.

name: portfolio

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # Separate local tag, so a dev build never wears a published release's name.
    image: portfolio-app:dev
    # Overrides compose.yaml's `always`, which would try to pull this local-only tag.
    pull_policy: build

  # Same tag as `app` above, built from the same checkout: without this,
  # smoke would pull the released image, which lacks server/price-worker.ts,
  # and certify stale code. compose.yaml's `volumes:` and `networks:` for
  # `worker` survive the merge untouched — mappings merge, sequences append,
  # scalars override.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: portfolio-app:dev
    pull_policy: build

  # CI asserts the dump container reaches `healthy` inside a smoke test that
  # lasts minutes, not hours: production's 5-minute interval and 15-minute
  # start period would still read `starting` when the run ends. The check
  # itself is compose.yaml's — only its cadence changes here.
  dump:
    healthcheck:
      interval: 5s
      timeout: 10s
      retries: 3
      start_period: 30s
