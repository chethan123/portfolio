# Development override — builds `app` from this checkout. compose.yaml has no
# `build:` stanza on purpose, so this is the only place one is configured.
#
#     docker compose -f compose.yaml -f compose.dev.yaml up -d --build

name: portfolio

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # Local-only tag, so a dev build never wears a published release's name.
    image: portfolio-app:dev
    # compose.yaml's `always` would try to pull this local-only tag.
    pull_policy: build

  # Built here too, or smoke pulls the released image and certifies stale code.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: portfolio-app:dev
    pull_policy: build

  egress-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    image: portfolio-app:dev
    pull_policy: build

  # Cadence only — the check itself is compose.yaml's. Production's 5m interval
  # and 15m start period would still read `starting` when a smoke run ends.
  dump:
    healthcheck:
      interval: 5s
      timeout: 10s
      retries: 3
      start_period: 30s
